version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blht-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
      - ./docker-compose.env
    environment:
      - FRONTEND_ORIGIN=http://localhost:80
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - blht-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blht-frontend
    ports:
      - "80:80"
    # API calls are same-origin (/api) and nginx proxies them to the backend
    # container, so no VITE_API_URL is needed at runtime. (Vite env vars are
    # baked at build time; a runtime value is ignored by the static build and
    # http://localhost:4000 would point at the visitor's own machine.)
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - blht-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: blht-mongodb
    # Removed port exposure for security - accessible only via internal network
    env_file:
      - ./docker-compose.env
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - blht-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (for future caching)
  redis:
    image: redis:7-alpine
    container_name: blht-redis
    # Removed port exposure for security - accessible only via internal network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - blht-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  blht-network:
    driver: bridge