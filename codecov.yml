# Codecov configuration
# See https://docs.codecov.com/docs/codecov-yaml for all options

coverage:
  status:
    project:
      default:
        # Match the thresholds enforced by vitest in CI
        # (backend is ~53% lines / ~37% functions - keep target attainable)
        target: 50%
        threshold: 2%
        base: auto
        flags:
          - backend
          - frontend
    patch:
      default:
        target: 50%
        threshold: 5%

flags:
  backend:
    paths:
      - backend/src
  frontend:
    paths:
      - frontend/src

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
